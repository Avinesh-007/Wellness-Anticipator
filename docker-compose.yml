version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: wellness_backend
    ports:
      - "8000:8000"
    environment:
      - PROJECT_NAME=Wellness Anticipator API
      - ENVIRONMENT=development
      - DEBUG=true
      - SECRET_KEY=dev-secret-key-for-local-docker-compose-minimum-32-chars
      - DATABASE_URL=sqlite:///./wellness_anticipator.db
      - BACKEND_CORS_ORIGINS=http://localhost:3000,http://localhost:5173,http://127.0.0.1:5173,http://127.0.0.1:3000,http://localhost:8080
      - LOG_LEVEL=INFO
      - WELLNESS_MODEL_PATH=/app/ml/models/serialized/diabetes_baseline_lr.joblib
    volumes:
      - ./backend/wellness_anticipator.db:/app/wellness_anticipator.db
      - ./ml/models/serialized:/app/ml/models/serialized:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: wellness_web
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost/"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped
